<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Pertandingan Badminton - Display TV & Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            overflow-x: auto;
            position: relative;
        }

        /* Container Tombol Kontrol */
        .controls-container {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 16px;
            z-index: 100;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 16px 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-size: 1.15rem;
            font-weight: 800;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
            transform: scale(1.05);
        }

        .btn-reset:hover {
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }

        /* Sembunyikan tombol & kursor saat Fullscreen aktif */
        :fullscreen .controls-container,
        :-webkit-full-screen .controls-container {
            display: none !important;
        }

        :fullscreen, :fullscreen * {
            cursor: none !important;
        }
        :-webkit-full-screen, :-webkit-full-screen * {
            cursor: none !important;
        }

        /* Header Utama Diperbesar */
        .header {
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        
        .header h1 {
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #ffb703 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 242, 254, 0.5);
        }

        /* Container Bagan Desktop (Grid 5 Kolom Diperlebar) */
        .bracket-container {
            display: grid;
            grid-template-columns: 360px 290px 400px 290px 360px;
            gap: 28px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1900px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            min-height: 680px;
        }

        .round-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* Box Match Diperbesar dengan Padding Lebih Luas */
        .match-box {
            background: rgba(255, 255, 255, 0.14);
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 14px 45px 0 rgba(0, 0, 0, 0.45);
            padding: 18px;
            transition: all 0.3s ease;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.42);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 8px 0;
            border-left: 8px solid #00f2fe;
        }

        .team-row.away {
            border-left-color: #ff007f;
        }

        /* Input Teks & Skor Diperbesar */
        .team-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.55rem;
            font-weight: 800;
            width: 100%;
            outline: none;
            font-family: inherit;
            text-transform: uppercase;
        }

        .score-input {
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            width: 58px;
            height: 52px;
            outline: none;
            margin-left: 14px;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        .final-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .final-box {
            width: 100%;
            border: 3px solid rgba(255, 215, 0, 0.85);
            box-shadow: 0 0 45px rgba(255, 215, 0, 0.4);
        }

        .champion-box {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.3) 0%, rgba(255, 215, 0, 0.12) 100%);
            border: 3px solid #ffb703;
            border-radius: 24px;
            backdrop-filter: blur(16px);
            padding: 26px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 183, 3, 0.5);
        }

        .trophy-icon { font-size: 4.5rem; margin-bottom: 8px; }
        .champion-title { font-size: 1.35rem; letter-spacing: 3px; color: #ffb703; font-weight: 900; text-transform: uppercase; }
        .champion-input { text-align: center; font-size: 2.1rem; font-weight: 900; color: #ffffff; margin-top: 10px; }

        /* ==========================================
           TAMPILAN KHUSUS MOBILE (EKSTRA JELAS & RAPI)
           ========================================== */
        @media (max-width: 1024px) {
            body {
                padding: 20px 12px;
                justify-content: flex-start;
            }

            .controls-container {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                justify-content: center;
                margin-bottom: 25px;
            }

            .btn-control {
                padding: 14px 22px;
                font-size: 1.05rem;
            }

            .header {
                margin-bottom: 28px;
            }

            .header h1 {
                font-size: 2.3rem;
                letter-spacing: 1px;
            }

            .bracket-container {
                display: flex;
                flex-direction: column;
                gap: 28px;
                max-width: 100%;
            }

            .round {
                min-height: auto;
                gap: 18px;
            }

            /* Urutan Kronologis Mobile: 8 Besar -> Semifinal -> Final & Juara */
            .round-8-left    { order: 1; }
            .round-8-right   { order: 2; }
            .round-semi-left { order: 3; }
            .round-semi-right{ order: 4; }
            .center-column    { order: 5; }

            .center-column {
                gap: 25px;
            }
            .final-wrapper { order: 1; }
            .champion-box  { order: 2; }

            .round-title {
                font-size: 1.45rem;
            }

            .team-input {
                font-size: 1.3rem;
            }

            .score-input {
                width: 52px;
                height: 46px;
                font-size: 1.45rem;
            }

            .trophy-icon {
                font-size: 3.8rem;
            }

            .champion-title {
                font-size: 1.2rem;
            }

            .champion-input {
                font-size: 1.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="controls-container">
        <button class="btn-control btn-reset" onclick="resetData()">🔄 Reset Data</button>
        <button class="btn-control" onclick="toggleFullScreen()">📺 Full Screen</button>
    </div>

    <div class="header">
        <h1>Turnamen Badminton Hari Radio ke 81</h1>
    </div>

    <div class="bracket-container">
        <!-- 1. BABAK 8 BESAR (KIRI) -->
        <div class="round round-8-left">
            <div class="round-title">8 Besar (Kiri)</div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM A1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM A2"><input type="number" class="score-input" value="0"></div>
            </div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM B1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM B2"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- 2. BABAK SEMIFINAL (KIRI) -->
        <div class="round round-semi-left">
            <div class="round-title">Semifinal</div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="PEMENANG A"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="PEMENANG B"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- 3. BABAK FINAL & JUARA (TENGAH) -->
        <div class="center-column">
            <div class="champion-box">
                <div class="trophy-icon">🏆</div>
                <div class="champion-title">Juara Utama</div>
                <input type="text" class="team-input champion-input" value="NAMA JUARA">
            </div>
            <div class="final-wrapper">
                <div class="round-title" style="margin-bottom: 14px; font-size: 1.8rem;">FINAL</div>
                <div class="match-box final-box">
                    <div class="team-row"><input type="text" class="team-input" value="FINALIS KIRI"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="FINALIS KANAN"><input type="number" class="score-input" value="0"></div>
                </div>
            </div>
        </div>

        <!-- 4. BABAK SEMIFINAL (KANAN) -->
        <div class="round round-semi-right">
            <div class="round-title">Semifinal</div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="PEMENANG C"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="PEMENANG D"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- 5. BABAK 8 BESAR (KANAN) -->
        <div class="round round-8-right">
            <div class="round-title">8 Besar (Kanan)</div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM C1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM C2"><input type="number" class="score-input" value="0"></div>
            </div>
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM D1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM D2"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>
    </div>

    <!-- SDK Firebase JS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJoXlc5EP9LmbINBvlJfsVJPDdlEgJY1o",
            authDomain: "bagan-badminton.firebaseapp.com",
            databaseURL: "https://bagan-badminton-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bagan-badminton",
            storageBucket: "bagan-badminton.firebasestorage.app",
            messagingSenderId: "776101992812",
            appId: "1:776101992812:web:554e0e50d1528cc530fb49",
            measurementId: "G-G0T4KYS4W2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const bracketRef = db.ref('badminton_bracket');

        const allInputs = document.querySelectorAll('input');

        allInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                bracketRef.child(index).set(input.value);
            });
        });

        bracketRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((index) => {
                    if (allInputs[index] && allInputs[index].value !== data[index]) {
                        allInputs[index].value = data[index];
                    }
                });
            }
        });

        function resetData() {
            if (confirm("Apakah Anda yakin ingin mereset bagan di SEMUA device?")) {
                bracketRef.remove().then(() => {
                    location.reload();
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
