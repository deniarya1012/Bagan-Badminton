<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Pertandingan Badminton - Display TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow-x: auto;
            position: relative;
        }

        /* Container Tombol Kontrol (Kanan Atas) */
        .controls-container {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: scale(1.05);
        }

        .btn-reset:hover {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        /* Sembunyikan tombol saat Fullscreen aktif */
        :fullscreen .controls-container,
        :-webkit-full-screen .controls-container {
            display: none !important;
        }

        /* Header Sporty Ekstra Besar */
        .header {
            text-align: center;
            margin-bottom: 35px;
            text-transform: uppercase;
        }
        
        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #ffb703 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        /* Container Bagan */
        .bracket-container {
            display: grid;
            grid-template-columns: 310px 250px 340px 250px 310px;
            gap: 25px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1700px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            min-height: 620px;
        }

        .round-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            margin-bottom: 16px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        /* Box Liquid Glass Effect Ekstra Jelas */
        .match-box {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            padding: 14px;
            transition: all 0.3s ease;
        }

        .match-box:hover {
            border-color: rgba(0, 242, 254, 0.8);
            box-shadow: 0 12px 40px 0 rgba(0, 242, 254, 0.25);
        }

        /* Tim Row & Editable Input */
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            margin: 6px 0;
            border-left: 6px solid #00f2fe;
        }

        .team-row.away {
            border-left-color: #ff007f;
        }

        .team-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 800;
            width: 100%;
            outline: none;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-input {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 900;
            text-align: center;
            width: 48px;
            height: 42px;
            outline: none;
            margin-left: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .score-input:focus {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.25);
        }

        /* Center / Final & Winner Column */
        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .final-box {
            width: 100%;
            border: 2px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.3);
        }

        .champion-box {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.25) 0%, rgba(255, 215, 0, 0.08) 100%);
            border: 3px solid #ffb703;
            border-radius: 20px;
            backdrop-filter: blur(16px);
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 183, 3, 0.4);
        }

        .trophy-icon { 
            font-size: 3.5rem; 
            margin-bottom: 5px; 
            filter: drop-shadow(0 0 10px rgba(255, 183, 3, 0.6));
        }
        
        .champion-title {
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #ffb703;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .champion-input {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }
    </style>
</head>
<body>

    <!-- Kontrol Tombol -->
    <div class="controls-container">
        <button class="btn-control btn-reset" onclick="resetData()">🔄 Reset Data</button>
        <button class="btn-control" onclick="toggleFullScreen()">📺 Full Screen</button>
    </div>

    <div class="header">
        <h1>Badminton Tournament</h1>
    </div>

    <div class="bracket-container">
        <!-- 8 BESAR - KIRI -->
        <div class="round">
            <div class="round-title">8 Besar (Kiri)</div>
            
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM A1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM A2"><input type="number" class="score-input" value="0"></div>
            </div>

            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM B1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM B2"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- SEMIFINAL - KIRI -->
        <div class="round">
            <div class="round-title">Semifinal</div>
            
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="PEMENANG A"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="PEMENANG B"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- FINAL & JUARA - TENGAH -->
        <div class="center-column">
            <div class="champion-box">
                <div class="trophy-icon">🏆</div>
                <div class="champion-title">Juara Utama</div>
                <input type="text" class="team-input champion-input" value="NAMA JUARA">
            </div>

            <div class="round-title" style="margin-bottom:0; font-size: 1.5rem;">FINAL</div>

            <div class="match-box final-box">
                <div class="team-row"><input type="text" class="team-input" value="FINALIS KIRI"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="FINALIS KANAN"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- SEMIFINAL - KANAN -->
        <div class="round">
            <div class="round-title">Semifinal</div>
            
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="PEMENANG C"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="PEMENANG D"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>

        <!-- 8 BESAR - KANAN -->
        <div class="round">
            <div class="round-title">8 Besar (Kanan)</div>
            
            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM C1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM C2"><input type="number" class="score-input" value="0"></div>
            </div>

            <div class="match-box">
                <div class="team-row"><input type="text" class="team-input" value="TIM D1"><input type="number" class="score-input" value="0"></div>
                <div class="team-row away"><input type="text" class="team-input" value="TIM D2"><input type="number" class="score-input" value="0"></div>
            </div>
        </div>
    </div>

    <script>
        // Fitur Auto-Save menggunakan LocalStorage
        document.addEventListener('DOMContentLoaded', () => {
            const allInputs = document.querySelectorAll('input');

            // 1. Muat data tersimpan saat halaman dibuka/direfresh
            allInputs.forEach((input, index) => {
                const savedValue = localStorage.getItem(`badminton_bracket_${index}`);
                if (savedValue !== null) {
                    input.value = savedValue;
                }

                // 2. Simpan otomatis setiap ada perubahan pada input
                input.addEventListener('input', () => {
                    localStorage.setItem(`badminton_bracket_${index}`, input.value);
                });
            });
        });

        // Fitur Reset Data ke Semula
        function resetData() {
            if (confirm("Apakah Anda yakin ingin mereset bagan ke tampilan awal? Data yang diisi akan dihapus.")) {
                const allInputs = document.querySelectorAll('input');
                allInputs.forEach((input, index) => {
                    localStorage.removeItem(`badminton_bracket_${index}`);
                });
                location.reload();
            }
        }

        // Fitur Fullscreen
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
